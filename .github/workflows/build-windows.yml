name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rise-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build, test, publish and validate executable
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package and verify Windows installer and shortcuts
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/test-installer.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: RISE-win-x64
          path: |
            artifacts/publish/
            artifacts/installer/
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RISE-windows-test-evidence
          path: artifacts/smoke/
          if-no-files-found: warn
      - name: Publish versioned release after successful verification
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Rise.App/Rise.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; build artifacts uploaded."; exit 0 }
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/RISE-win-x64.zip
          @('artifacts/publish/RISE.exe', 'artifacts/installer/RISE-Setup.exe', 'artifacts/RISE-win-x64.zip') | ForEach-Object {
            $file = Get-Item $_
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt
          gh release create $tag artifacts/publish/RISE.exe artifacts/installer/RISE-Setup.exe artifacts/RISE-win-x64.zip artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RISE.EXE $tag" --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
